<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SearchCrew">
  <!-- Favicon variant. At 16px the three signal bars of the full mark merge into a
       smudge, so this drops to two, thickens every stroke, and enlarges the lens. -->
  <g transform="translate(1 2)">
    <g fill="none" stroke="var(--mark-ink, #16181D)" stroke-width="8" stroke-linecap="round">
      <circle cx="36" cy="26" r="17"/>
      <path d="M48.5 38.5 L57 47"/>
    </g>
    <g fill="none" stroke="var(--mark-accent, #FF5A1F)" stroke-width="8" stroke-linecap="round">
      <path d="M5 17 H24"/>
      <path d="M5 35 H22"/>
    </g>
    <g fill="var(--mark-accent, #FF5A1F)">
      <circle cx="30" cy="17" r="6"/>
      <circle cx="28" cy="35" r="6"/>
    </g>
  </g>
</svg>
